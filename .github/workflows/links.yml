name: Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # The checker settings live in lychee.toml, which the action's
          # shell-eval of these args would otherwise mangle.
          args: --verbose --no-progress README.md
