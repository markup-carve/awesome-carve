name: Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # --remap: github.com's rendered blob view answers 503 for files it
          # will not render, so all eight /blob/ links in the README failed
          # while the files were there. raw.githubusercontent.com serves the
          # same file and still answers 404 when a path is wrong, so the check
          # keeps its teeth. The remaining settings bound the request burst:
          # nearly every README link is a github.com URL.
          args: >-
            --verbose --no-progress
            --cache --max-cache-age 1d
            --max-concurrency 8
            --max-retries 5 --retry-wait-time 3
            --remap "https://github.com/([^/]+)/([^/]+)/blob/(.*) https://raw.githubusercontent.com/$1/$2/$3"
            README.md
